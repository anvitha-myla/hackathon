# Reduced-order Monod / Luedeking-Piret parameters.
# Intentionally NOT the full IndPenSim equation set (circularity).
# See docs/05_MECHANISTIC_MODEL_SPEC.md

family: reduced_order_monod
use_full_indpensim_equations: false
primary_estimate: biomass

states:
  biomass: true
  substrate: true
  product: true # internal Luedeking-Piret state; live output remains X
  volume: true

solver:
  method: BDF # BDF or Radau
  fallback_method: Radau
  rtol: 1.0e-6
  atol: 1.0e-8
  max_step: null
  timeout_s: 1.0

# Documented / assumed batch start — never from future reference biomass.
initialize_from_reference_biomass: false
initial_conditions:
  X: 0.15 # g/L, documented assumption
  S: 15.0 # g/L
  P: 0.0 # g/L
  V: 100.0 # L
  t: 0.0 # h

parameters:
  mu_max: 0.12 # 1/h
  K_s: 0.5 # g/L
  K_DO: 2.0 # % saturation (or same units as DO input)
  k_d: 0.01 # 1/h
  Y_xs: 0.45 # gX / gS
  m_s: 0.03 # gS / (gX h)
  S_f: 500.0 # g/L feed concentration
  alpha: 0.05 # gP / gX (growth-associated)
  beta: 0.008 # gP / (gX h) (non-growth associated)
  V_min: 1.0e-6 # L, dilution guard

stability:
  clamp_negative: true
  max_X: 1.0e6
  max_S: 1.0e6
  max_P: 1.0e6
  max_V: 1.0e6
  negative_tol: 1.0e-8 # numerical overshoot; larger negatives are flagged

# Live step() must not accept these keys (anti-leakage).
forbidden_live_keys:
  - X_reference
  - x_reference
  - biomass_reference
  - reference_biomass
  - Penicillin_biomass
  - biomass
